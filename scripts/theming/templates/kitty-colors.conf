# kitty colors — Afloat palette (matugen-compatible template)
# ANSI mapping rule: every slot keeps its own accent hue — normals are the
# darkened step, brights the base step (standard terminal lightness pairs).
# Never use on_*_container inks here: they collapse all hues toward the same
# tone extreme and collide with each other (and color8 must stay a mid grey
# clearly apart from the foreground, or shell autosuggestions blend into
# typed text).
foreground            {{colors.on_surface.default.hex}}
background            {{colors.surface.default.hex}}
selection_foreground  {{colors.on_secondary.default.hex}}
selection_background  {{colors.secondary.default.hex}}
cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.surface.default.hex}}
url_color             {{colors.tertiary.default.hex}}
active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.outline_variant.default.hex}}
bell_border_color     {{colors.error.default.hex}}
active_tab_foreground   {{colors.on_surface.default.hex}}
active_tab_background   {{colors.primary_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
inactive_tab_background {{colors.surface_container_high.default.hex}}
tab_bar_background      {{colors.surface_container_lowest.default.hex}}

# Normal ANSI. Red/green/yellow come straight from the palette; the warm
# palette has no cool hues, so blue/magenta/cyan are anchored with set_hue
# (hue fixed per slot, saturation/lightness still follow the wallpaper).
# Hierarchy reads via color, not dimming (transparent-terminal clear text).
color0 {{colors.on_surface.default.hex | darken: 65.0}}
color1 {{colors.error.default.hex | darken: 10.0}}
color2 {{colors.tertiary.default.hex | darken: 14.0}}
color3 {{colors.secondary.default.hex | darken: 14.0}}
color4 {{colors.primary.default.hex | set_hue: 220.0 | darken: 8.0}}
color5 {{colors.primary_fixed_dim.default.hex | set_hue: 300.0 | darken: 8.0 | saturate: 15.0}}
color6 {{colors.tertiary_fixed_dim.default.hex | set_hue: 185.0 | darken: 8.0 | saturate: 15.0}}
color7 {{colors.on_surface_variant.default.hex}}

# Bright ANSI (base step of each accent hue; color8 is a mid grey derived
# from on_surface_variant so muted text tracks both modes).
color8  {{colors.on_surface_variant.default.hex | darken: 12.0}}
color9  {{colors.error.default.hex}}
color10 {{colors.tertiary.default.hex | darken: 5.0}}
color11 {{colors.secondary.default.hex | darken: 5.0}}
color12 {{colors.primary.default.hex | set_hue: 220.0}}
color13 {{colors.primary_fixed_dim.default.hex | set_hue: 300.0}}
color14 {{colors.tertiary_fixed_dim.default.hex | set_hue: 185.0}}
color15 {{colors.on_surface.default.hex}}
