# Afloat-generated Herdr theme overrides — **light** appearance（浅色专用）
#
# 由 apply_app_themes.py 渲染，产物写到
# ~/.config/afloat/app-themes/herdr-light.toml；同目录的 herdr-dark.toml 是深色版。
# apply_app_themes.py 会把**与当前模式匹配**的那一份写进
# ~/.config/herdr/config.toml 的「Afloat managed」块（并在模式切换时重写 + reload）。
# 不要手改 config.toml 里的 `[theme.custom]`：下一次渲染会覆盖。
#
# 注意（herdr 0.9.5 实测）：`herdr server reload-config` 只对之后 attach 的
# 客户端生效，已经开着的 TUI 会继续用它 attach 时解析出的调色板（即使整屏
# 重绘也不会变）。要立刻看到新配色，在那个 TUI 里按 prefix+shift+r
# （keys.reload_config），或重连（prefix+q 后重开）。
#
# 为什么不用 herdr 的 [theme.custom.light]/[.dark] 子表：
# 它们在 auto_switch = true 时才叠加，而 herdr 只在启动时查询一次宿主外观，
# 所以 herdr-radar 插件固定 auto_switch = false、自己改写 [theme] name 来切主题。
# 于是子表永远不会生效，只有一个静态 [theme.custom] 会被读 —— 这正是「浅色下
# 拿到深色 accent」的根因。模式由 Afloat 这边决定，就直接写模式正确的那张表。
#
# 键语义（按 herdr 0.9.5 实测渲染结果，不是猜的）：
#   accent        选中 tab 的**底色**，该 tab 的标签用 panel_bg 画
#                 → 两者必须互相对比 ≥ 4.5，否则标签糊在底色里
#   surface0      未选中 tab 的底色，其标签用 overlay0
#   panel_bg      tab 栏/面板底色，同时是活动 tab 的标签色
#   sidebar_bg    侧边栏底色（pane 内容不受影响，仍是终端自己的透明背景）
#   active_row_bg 侧边栏选中行底色（标签同样用 overlay0）
#   surface_dim   分隔线、树形连接线
#   overlay0/1    次要文字 / 常规文字
#
# 本模式的关键约束（Noctalia 的浅色阶梯是反的：container 比 surface 更深）:
#   · 活动 tab 的标签用 panel_bg 画在 accent 上 → accent 必须深、panel 必须浅；
#   · 未选中 tab / 侧边栏标签用 overlay0(深) → 它们的底色必须保持浅；
#     未选中 tab 索性不画底色（surface0 = "reset"），选中行只能取
#     surface_container 档，不能再深。
# 括号里是本模式调色板的实测对比度。

[theme.custom]
text = "{{colors.on_surface.light.hex}}"
subtext0 = "{{colors.on_surface_variant.light.hex}}"
overlay0 = "{{colors.on_surface_variant.light.hex}}"
overlay1 = "{{colors.on_surface.light.hex}}"

# 背景层：一律 "reset"（不画底色），chrome 直接露出终端背景 = kitty 的
# translucent surface，壁纸透光得以保留。之前这里取显式色，面板就被刷成
# 不透明了（tab 栏与 agents 侧边栏都一样）。
panel_bg = "reset"
sidebar_bg = "reset"
# 未选中 tab：底色用 "reset"（不画底色，露出终端自己的背景 = kitty 的
# surface，仍随调色板走）；标签 overlay0 压在那层上 6.4:1。
surface0 = "reset"
surface1 = "{{colors.surface_container_high.light.hex}}"
surface_dim = "{{colors.outline_variant.light.hex}}"

# accent 是活动 tab 的底色 + 焦点边框。
# 实测：panel_bg = "reset" 时，活动 tab 的**标签色回落到 surface_dim**
# （把 surface_dim 改成 #0000ff，标签立刻变蓝）。而 surface_dim 又是分隔线，
# 只能留在 outline_variant 档，于是 accent 必须与它拉开：压暗 26% 后标签
# 5.7:1、accent 对透明底 10.4:1。
accent = "{{colors.primary.light.hex | darken: 26.0}}"
# 选中行/选区：比侧边栏深一档（1.3）让选中可见，同时 overlay0 标签仍有 4.6:1。
active_row_bg = "{{colors.surface_container.light.hex}}"
selection_bg = "{{colors.surface_container.light.hex}}"

# 语义色都画在浅底上，M3 原值只有 2.5–3.8:1，统一压暗到 ≥4.8。
red = "{{colors.error.light.hex | darken: 16.0}}"
green = "{{colors.tertiary.light.hex | darken: 16.0}}"
yellow = "{{colors.secondary.light.hex | darken: 16.0}}"
blue = "{{colors.primary.light.hex | darken: 16.0}}"
mauve = "{{colors.primary_fixed_dim.light.hex}}"
teal = "{{colors.tertiary_fixed_dim.light.hex | darken: 10.0}}"
peach = "{{colors.secondary_fixed_dim.light.hex | darken: 10.0}}"
