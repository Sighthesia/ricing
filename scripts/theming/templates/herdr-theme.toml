# Afloat-generated Herdr theme overrides.
# 参考上游模板结构: https://github.com/InioX/matugen-themes/tree/main/templates
# (上游暂无 herdr 模板;键名来自 Herdr 配置参考 [theme] / [theme.custom])。
# 用法: 将本文件内容追加合并到 ~/.config/herdr/config.toml，
# 保留 [theme] name = "terminal" 让基础色跟随 kitty ANSI，并建议开启:
#   [theme]
#   name = "terminal"
#   auto_switch = true
# 明暗子表一次写全，Herdr 按宿主终端报告的外观自动选用。注意：实时壁纸输入
# 只有当前模式，另一子表回退为同值，切模式重渲染后自动修正。

[theme.custom]
accent = "{{colors.primary.default.hex}}"
red = "{{colors.error.default.hex}}"
green = "{{colors.tertiary.default.hex}}"
yellow = "{{colors.secondary.default.hex}}"
blue = "{{colors.primary.default.hex}}"
# 与 kitty bright 槽同构：magenta/cyan 槽取 fixed-dim 阶，herdr 的
# mauve/teal/peach 跟随它们，七个语义色各保一阶、不互撞。
mauve = "{{colors.primary_fixed_dim.default.hex}}"
teal = "{{colors.tertiary_fixed_dim.default.hex}}"
peach = "{{colors.secondary_fixed_dim.default.hex}}"

[theme.custom.light]
text = "{{colors.on_surface.light.hex}}"
subtext0 = "{{colors.on_surface_variant.light.hex}}"
panel_bg = "reset"
sidebar_bg = "reset"
# 活动边框/焦点指示与顶部选中 tab 共用 accent（Herdr 键位限制，拆不开）：
# light 下按用户要求取 kitty 非活动 tab 色（surface_container_high），
# 与选中行/overlay0 同色，边框存在感弱化；dark 下保持 primary 强色。
accent = "{{colors.surface_container_high.light.hex}}"
active_row_bg = "{{colors.surface_container_high.light.hex}}"
selection_bg = "{{colors.surface_container_high.light.hex}}"
# 表面阶梯：dim < surface0 < surface1 < overlay0 < overlay1，
# 与 kitty tab 栏底（surface_container_lowest）同源。
surface_dim = "{{colors.surface_container_lowest.light.hex}}"
surface0 = "{{colors.surface_container_low.light.hex}}"
surface1 = "{{colors.surface_container.light.hex}}"
overlay0 = "{{colors.surface_container_high.light.hex}}"
overlay1 = "{{colors.surface_container_highest.light.hex}}"

[theme.custom.dark]
text = "{{colors.on_surface.dark.hex}}"
subtext0 = "{{colors.on_surface_variant.dark.hex}}"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "{{colors.surface_container_high.dark.hex}}"
selection_bg = "{{colors.surface_container_high.dark.hex}}"
surface_dim = "{{colors.surface_container_lowest.dark.hex}}"
surface0 = "{{colors.surface_container_low.dark.hex}}"
surface1 = "{{colors.surface_container.dark.hex}}"
overlay0 = "{{colors.surface_container_high.dark.hex}}"
overlay1 = "{{colors.surface_container_highest.dark.hex}}"
