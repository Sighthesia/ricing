# Afloat-generated Herdr theme overrides.
# 参考上游模板结构: https://github.com/InioX/matugen-themes/tree/main/templates
# (上游暂无 herdr 模板;键名来自 Herdr 配置参考 [theme] / [theme.custom])。
# 用法: 将本文件内容追加合并到 ~/.config/herdr/config.toml，
# 保留 [theme] name = "terminal" 让基础色跟随 kitty ANSI，并建议开启:
#   [theme]
#   name = "terminal"
#   auto_switch = true
# 明暗子表一次写全，Herdr 按宿主终端报告的外观自动选用。注意：实时壁纸输入
# 只有当前模式，另一子表回退为同值，切模式重渲染后自动修正。

[theme.custom]
accent = "{{colors.primary.default.hex}}"
red = "{{colors.error.default.hex}}"
green = "{{colors.tertiary.default.hex}}"
yellow = "{{colors.secondary.default.hex}}"
blue = "{{colors.primary.default.hex}}"

[theme.custom.light]
text = "{{colors.on_surface.light.hex}}"
panel_bg = "reset"
sidebar_bg = "reset"
# 活动边框/焦点指示与顶部选中 tab 共用 accent（Herdr 键位限制，拆不开）：
# 此处取 primary（= color8，动态跟随），边框回到强色，tab 底同步变回赭红；
# spaces/agents 行是独立键，不受影响，继续对齐非活动 tab 色。
accent = "{{colors.primary.light.hex}}"
active_row_bg = "{{colors.surface_container_high.light.hex}}"
selection_bg = "{{colors.surface_container_high.light.hex}}"

[theme.custom.dark]
text = "{{colors.on_surface.dark.hex}}"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "{{colors.surface_container_high.dark.hex}}"
selection_bg = "{{colors.surface_container_high.dark.hex}}"
