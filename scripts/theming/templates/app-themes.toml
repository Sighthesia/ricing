# Afloat app theme targets (matugen-compatible template config).
# Rendered by apply_app_themes.py from the active palette (wallpaper
# colors.json or a color scheme preset) for the effective light/dark mode.

[templates.kitty]
input_path = "./kitty-colors.conf"
output_path = "~/.config/kitty/kitty-colors.conf"

[templates.gtk3]
input_path = "./gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "./gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.qt5ct]
input_path = "./qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/Afloat.conf"

[templates.qt6ct]
input_path = "./qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/Afloat.conf"

[templates.kde]
input_path = "./kde-colors.conf"
output_path = "~/.local/share/color-schemes/Afloat.colors"

# Compositor: niri merges top-level includes; add once to config.kdl:
#   include "~/dotfiles path.../afloat-colors.kdl" (or the absolute path below)
[templates.niri]
input_path = "./niri-colors.kdl"
output_path = "~/.config/niri/afloat-colors.kdl"

# Terminals.
[templates.foot]
input_path = "./foot-colors.ini"
output_path = "~/.config/foot/colors.ini"

[templates.alacritty]
input_path = "./alacritty.toml"
output_path = "~/.config/alacritty/Afloat.toml"

# System monitors / file managers / visualizers.
[templates.btop]
input_path = "./btop.theme"
output_path = "~/.config/btop/themes/Afloat.theme"

[templates.yazi]
input_path = "./yazi-theme.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.cava]
input_path = "./cava-colors.ini"
output_path = "~/.config/cava/config"

# Editors / prompts / multiplexers / pagers.
[templates.helix]
input_path = "./helix.toml"
output_path = "~/.config/helix/themes/Afloat.toml"

[templates.zed]
input_path = "./zed-colors.json"
output_path = "~/.local/share/zed/themes/Afloat.json"

[templates.vscode]
input_path = "./vscode-colors.json"
output_path = "~/.config/Code/User/Afloat-color-theme.json"

[templates.starship]
input_path = "./starship-colors.toml"
output_path = "~/.config/starship-Afloat.toml"

[templates.tmux]
input_path = "./tmux-colors.conf"
output_path = "~/.config/tmux/Afloat-colors.conf"

[templates.zathura]
input_path = "./zathura-colors"
output_path = "~/.config/zathura/Afloat-colors"

# Launchers.
[templates.rofi]
input_path = "./rofi-colors.rasi"
output_path = "~/.config/rofi/Afloat-colors.rasi"

[templates.fuzzel]
input_path = "./fuzzel.ini"
output_path = "~/.config/fuzzel/Afloat.ini"

# Firefox: generation only. To use it, enable
# toolkit.legacyUserProfileCustomizations.stylesheets and import this file
# from a profile's chrome/userChrome.css.
[templates.firefox]
input_path = "./firefox-colors.css"
output_path = "~/.config/afloat/app-themes/firefox-colors.css"

# opencode: dual dark/light variants in one file, and the file does not depend
# on --mode (both palettes are always written). opencode picks the half matching
# its own resolved mode, so a desktop switch needs no file rewrite and no
# reload signal — do not add one. Generation only: activate with /theme afloat.
# 键覆盖参考上游: https://github.com/InioX/matugen-themes/blob/main/templates/opencode-colors.json
# 不要把两套压平成同一份数据：那样模式翻转不会产生任何视觉变化。
[templates.opencode]
input_path = "./opencode-theme.json"
output_path = "~/.config/opencode/themes/Afloat.json"

# Herdr: generation only (config.toml 含用户按键绑定，不可整体覆写).
# Merge the rendered snippet's [theme.custom] tables into
# ~/.config/herdr/config.toml, keeping [theme] name = "terminal" so the base
# follows the kitty ANSI palette; enable auto_switch for light/dark subtables.
[templates.herdr]
input_path = "./herdr-theme.toml"
output_path = "~/.config/afloat/app-themes/herdr-theme.toml"

# pi: 键覆盖参考 https://pi.dev/schemas/theme.schema.json
# appearance 是固定字段，所以明暗分成两个文件；pi 只热加载
# <agent-dir>/themes/<name>.json 中当前选中的那一个。
# 启用：settings.json 里 "theme": "afloat-light/afloat-dark"
# （斜杠前为浅色、后为深色；也可单独选其中一个名字）。
[templates.pi-dark]
input_path = "./pi-theme-dark.json"
output_path = "~/.pi/agent/themes/afloat-dark.json"

[templates.pi-light]
input_path = "./pi-theme-light.json"
output_path = "~/.pi/agent/themes/afloat-light.json"
