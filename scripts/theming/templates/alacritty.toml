[colors.primary]
background = '{{colors.background.default.hex}}'
foreground = '{{colors.on_surface.default.hex}}'
 
[colors.cursor]
text = '{{colors.on_surface.default.hex}}'
cursor = '{{colors.on_surface_variant.default.hex}}' 
 
[colors.vi_mode_cursor]
text = '{{colors.background.default.hex}}'
cursor = '{{colors.primary.default.hex}}' 
 
[colors.search.matches]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.tertiary.default.hex}}' 
 
[colors.search.focused_match]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.primary.default.hex}}' 
 
[colors.footer_bar]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.inverse_surface.default.hex}}' 
 
[colors.hints.start]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.secondary.default.hex}}' 
 
[colors.hints.end]
foreground = '{{colors.surface_variant.default.hex}}' 
background = '{{colors.secondary.default.hex}}' 
 
[colors.selection]
text = '{{colors.on_primary.default.hex}}'
background = '{{colors.primary.default.hex}}'


# 16-color palette — same role mapping as the kitty template:
# normals are the darkened step of each accent hue, brights the base step.
[colors.normal]
black = '{{colors.surface_container_highest.default.hex | set_lightness: 16.0}}'
red = '{{colors.error.default.hex | darken: 10.0}}'
green = '{{colors.tertiary.default.hex | darken: 14.0}}'
yellow = '{{colors.secondary.default.hex | darken: 14.0}}'
blue = '{{colors.primary.default.hex | darken: 10.0}}'
magenta = '{{colors.primary_fixed_dim.default.hex | darken: 8.0}}'
cyan = '{{colors.tertiary_fixed_dim.default.hex | darken: 8.0}}'
white = '{{colors.on_surface_variant.default.hex}}'


[colors.bright]
black = '{{colors.outline.default.hex | darken: 5.0}}'
red = '{{colors.error.default.hex}}'
green = '{{colors.tertiary.default.hex | darken: 5.0}}'
yellow = '{{colors.secondary.default.hex | darken: 5.0}}'
blue = '{{colors.primary.default.hex}}'
magenta = '{{colors.primary_fixed_dim.default.hex}}'
cyan = '{{colors.tertiary_fixed_dim.default.hex}}'
white = '{{colors.on_surface.default.hex}}'


[colors.dim]
black = '{{colors.surface_container_highest.default.hex | set_lightness: 16.0}}'
red = '{{colors.error.default.hex | darken: 10.0}}'
green = '{{colors.tertiary.default.hex | darken: 14.0}}'
yellow = '{{colors.secondary.default.hex | darken: 14.0}}'
blue = '{{colors.primary.default.hex | darken: 10.0}}'
magenta = '{{colors.primary_fixed_dim.default.hex | darken: 8.0}}'
cyan = '{{colors.tertiary_fixed_dim.default.hex | darken: 8.0}}'
white = '{{colors.on_surface_variant.default.hex}}'
