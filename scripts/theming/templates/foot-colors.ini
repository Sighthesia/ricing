# ===================================================================
# 🎨 FOOT MATUGEN THEME 
# ===================================================================

# Afloat palette for foot — same role mapping as the kitty template:
# normals are the darkened step of each accent hue, brights the base step.
# (foot has no dark/light sections; this file is re-rendered per mode.)
[colors]
# Cursor Colors (Format: <text-color> <cursor-color>)
cursor={{colors.on_surface_variant.default.hex_stripped}} {{colors.on_surface.default.hex_stripped}}

# Base UI Colors
foreground={{colors.on_surface.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}
selection-foreground={{colors.on_primary.default.hex_stripped}}
selection-background={{colors.primary.default.hex_stripped}}
urls={{colors.tertiary.default.hex_stripped}}

# 16-color terminal palette (mirrors kitty-colors.conf mapping)
# Normal colors
regular0={{colors.surface_container_highest.default.hex_stripped | set_lightness: 16.0}}  # black
regular1={{colors.error.default.hex_stripped | darken: 10.0}}  # red
regular2={{colors.tertiary.default.hex_stripped | darken: 14.0}}  # green
regular3={{colors.secondary.default.hex_stripped | darken: 14.0}}  # yellow
regular4={{colors.primary.default.hex_stripped | darken: 10.0}}  # blue
regular5={{colors.primary_fixed_dim.default.hex_stripped | darken: 8.0}}  # magenta
regular6={{colors.tertiary_fixed_dim.default.hex_stripped | darken: 8.0}}  # cyan
regular7={{colors.on_surface_variant.default.hex_stripped}}  # white

# Bright colors
bright0={{colors.outline.default.hex_stripped | darken: 5.0}}  # bright black
bright1={{colors.error.default.hex_stripped}}  # bright red
bright2={{colors.tertiary.default.hex_stripped | darken: 5.0}}  # bright green
bright3={{colors.secondary.default.hex_stripped | darken: 5.0}}  # bright yellow
bright4={{colors.primary.default.hex_stripped}}  # bright blue
bright5={{colors.primary_fixed_dim.default.hex_stripped}}  # bright magenta
bright6={{colors.tertiary_fixed_dim.default.hex_stripped}}  # bright cyan
bright7={{colors.on_surface.default.hex_stripped}}  # bright white
