# DymicShell-owned matugen export config.
# Reference inspiration: Noctalia Shell template target registry
# https://github.com/noctalia-dev/noctalia-shell/blob/main/Services/Theming/TemplateRegistry.qml

[config]
version_check = false

[templates.dymicshell]
input_path = "./templates/colors.json"
output_path = "~/.local/state/quickshell/user/generated/colors.json"

[templates.gtk3]
input_path = "./templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "./templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.alacritty]
input_path = "./templates/alacritty.toml"
output_path = "~/.config/alacritty/colors.toml"

[templates.cava]
input_path = "./templates/cava-colors.ini"
output_path = "~/.config/cava/themes/matugen"

[templates.fuzzel]
input_path = "./templates/fuzzel.ini"
output_path = "~/.config/fuzzel/colors.ini"

[templates.ghostty]
input_path = "./templates/ghostty"
output_path = "~/.config/ghostty/themes/DymicShell"

[templates.cosmic]
input_path = "./templates/cosmic_theme.ron"
output_path = "~/.config/matugen/themes/matugen_cosmic.theme.ron"
post_hook = "python3 ./templates/cosmic_postprocess.py ~/.config/matugen/themes/matugen_cosmic.theme.ron"

[templates.helix]
input_path = "./templates/helix.toml"
output_path = "~/.config/helix/themes/matugen.toml"

[templates.hyprland]
input_path = "./templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.btop]
input_path = "./templates/btop.theme"
output_path = "~/.config/btop/themes/DymicShell.theme"

[templates.kitty]
input_path = "./templates/kitty-colors.conf"
output_path = "~/.config/kitty/kitty-colors.conf"

[templates.kvantum_kvconfig]
input_path = "./templates/kvantum-colors.kvconfig"
output_path = "~/.config/Kvantum/DymicShell/DymicShell.kvconfig"

[templates.labwc]
input_path = "./templates/labwc"
output_path = "~/.config/labwc/themerc-override"

[templates.mako]
input_path = "./templates/mako"
output_path = "~/.config/mako/mako-colors"

[templates.mcfly]
input_path = "./templates/mcfly.toml"
output_path = "~/.local/share/mcfly/config.toml"

[templates.micro]
input_path = "./templates/micro.micro"
output_path = "~/.config/micro/colorschemes/matugen.micro"

[templates.midnight-discord]
input_path = "./templates/midnight-discord.css"
output_path = "~/.config/matugen/midnight-discord.css"

[templates.opencode]
input_path = "./templates/opencode-colors.json"
output_path = "~/.config/opencode/themes/matugen.json"

[templates.pywalfox]
input_path = "./templates/pywalfox-colors.json"
output_path = "~/.cache/wal/colors.json"

[templates.starship]
input_path = "./templates/starship-colors.toml"
output_path = "~/.config/starship.toml"

[templates.qt5ct]
input_path = "./templates/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/DymicShell.conf"

[templates.qt6ct]
input_path = "./templates/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/DymicShell.conf"

[templates.kde]
input_path = "./templates/DymicShell.colors"
output_path = "~/.local/share/color-schemes/DymicShell.colors"

[templates.niri]
input_path = "./templates/niri-colors.kdl"
output_path = "~/.config/niri/colors.kdl"

[templates.rofi]
input_path = "./templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.rmpc]
input_path = "./templates/rmpc.ron"
output_path = "~/.config/rmpc/themes/matugen.ron"

[templates.tmux]
input_path = "./templates/tmux-colors.conf"
output_path = "~/.config/tmux/generated.conf"

[templates.steam]
input_path = "./templates/steam.css"
output_path = "~/.config/AdwSteamGtk/custom.css"

[templates.sway]
input_path = "./templates/sway-colors.conf"
output_path = "~/.config/sway/colors.conf"

[templates.dunst]
input_path = "./templates/dunstrc-colors"
output_path = "~/.config/dunst/dunstrc"

[templates.telegram]
input_path = "./templates/telegram.tdesktop-theme"
output_path = "~/.config/telegram/themes/matugen.tdesktop-theme"

[templates.television]
input_path = "./templates/television.toml"
output_path = "~/.config/television/themes/matugen.toml"

[templates.terminal-sequences]
input_path = "./templates/terminal-sequences"
output_path = "~/.cache/terminal-sequences"

[templates.zed]
input_path = "./templates/zed-colors.json"
output_path = "~/.config/zed/themes/matugen.json"

[templates.wine]
input_path = "./templates/wine.reg"
output_path = "/tmp/wine.reg"

[templates.zathura]
input_path = "./templates/zathura-colors"
output_path = "~/.config/zathura/zathurarc"

[templates.wezterm]
input_path = "./templates/wezterm_theme.toml"
output_path = "~/.config/wezterm/colors/DymicShell.toml"

[templates.yazi_flavor]
input_path = "./templates/yazi-flavor.toml"
output_path = "~/.config/yazi/flavors/dymicshell.yazi/flavor.toml"

[templates.yazi_tmtheme]
input_path = "./templates/yazi-tmtheme.xml"
output_path = "~/.config/yazi/flavors/dymicshell.yazi/tmtheme.xml"

[templates.quickshell_qml]
input_path = "./templates/quickshell.qml"
output_path = "~/.config/quickshell/Colors.qml"

[templates.neovim]
input_path = "./templates/neovim/nvim-colors.vim"
output_path = "~/.config/nvim/colors/matugen.vim"
