cursor            {{ colors.primary.default.hex }}
cursor_text_color {{ colors.on_primary.default.hex }}

foreground            {{ colors.on_surface.default.hex }}

<* if {{ is_dark_mode }} *>
    background            {{ colors.surface_container_lowest.dark.hex }}
    # Use on_secondary (darker) for selection foreground in dark mode for readability
    selection_foreground  {{ colors.on_secondary.dark.hex }}
    selection_background  {{ colors.secondary.dark.hex }}
    url_color             {{ colors.secondary.dark.hex }}
<* else *>
    background            {{ colors.surface_container_lowest.light.hex }}
    selection_foreground  {{ colors.on_primary.default.hex }}
    selection_background  {{ colors.secondary.light.hex }}
    url_color             {{ colors.secondary.light.hex }}
<* endif *>

#: black 000000 767676
# Palette: dark-mode vs light-mode handling
<* if {{ is_dark_mode }} *>
    # Dark-mode: slightly lighten foregrounds to increase contrast on dark backgrounds
    color0  {{ colors.surface_container_high.default.hex | lighten: 15.0 | lighten: 20.0 }}
    color8  {{ colors.surface_container_highest.default.hex | lighten: 20.0 }}
    #: red cc0403 f2201f
    color1  {{ base16.base08.default.hex | lighten: -5.0 | lighten: 15.0 }}
    color9  {{ base16.base08.default.hex | lighten: 10.0 }}
    #: green 19cb00 23fd00
    color2  {{ colors.secondary_fixed_dim.default.hex }}
    color10 {{ colors.secondary_fixed.default.hex }}
    #: yellow cecb00 fffd00
    color3  {{ colors.tertiary_fixed_dim.default.hex }}
    color11 {{ colors.tertiary_fixed.default.hex }}
    #: blue 0d73cc 1a8fff
    color4  {{ colors.on_primary_fixed_variant.default.hex | lighten: 15.0 | lighten: 20.0 }}
    color12 {{ colors.primary.default.hex }}
    #: magenta cb1ed1 fd28ff
    color5  {{ colors.on_secondary_fixed_variant.default.hex | lighten: 15.0 | lighten: 20.0 }}
    color13 {{ colors.secondary.default.hex }}
    #: cyan 0dcdcd 14ffff
    color6  {{ colors.on_tertiary_fixed_variant.default.hex | lighten: 15.0 | lighten: 20.0 }}
    color14 {{ colors.tertiary.default.hex }}
    #: white dddddd ffffff
    color7  {{ colors.on_surface_variant.default.hex }}
    color15 {{ colors.on_surface.default.hex }}

    mark1_foreground {{ colors.on_primary_fixed.default.hex | lighten: 15.0 | lighten: 20.0 }}
    mark1_background {{ colors.primary_fixed.default.hex }}
    mark2_foreground {{ colors.on_secondary_fixed.default.hex | lighten: 15.0 | lighten: 20.0 }}
    mark2_background {{ colors.secondary_fixed.default.hex }}
    mark3_foreground {{ colors.on_tertiary_fixed.default.hex | lighten: 15.0 }}
    mark3_background {{ colors.tertiary_fixed.default.hex }}
<* else *>
    # Light-mode: keep original semantic hues but ensure they contrast without
    # over-darkening. Avoid large negative lightening that makes colors near-black.
    color0  {{ colors.on_surface.default.hex }}
    color8  {{ colors.on_surface_variant.default.hex }}
    #: red cc0403 f2201f
    color1  {{ base16.base08.default.hex | lighten: -8.0 }}
    color9  {{ base16.base08.default.hex | lighten: -8.0 }}
    #: green 19cb00 23fd00
    color2  {{ colors.secondary.default.hex }}
    color10 {{ colors.secondary_fixed.default.hex | lighten: -8.0 }}
    #: yellow cecb00 fffd00
    color3  {{ colors.tertiary.default.hex }}
    color11 {{ colors.tertiary_fixed.default.hex | lighten: -8.0 }}
    #: blue 0d73cc 1a8fff
    color4  {{ colors.primary.default.hex }}
    color12 {{ colors.primary.default.hex | lighten: 6.0 }}
    #: magenta cb1ed1 fd28ff
    color5  {{ colors.secondary.default.hex }}
    color13 {{ colors.secondary_fixed.default.hex | lighten: -8.0 }}
    #: cyan 0dcdcd 14ffff
    color6  {{ colors.tertiary.default.hex }}
    color14 {{ colors.tertiary_fixed.default.hex | lighten: -8.0 }}
    #: white dddddd ffffff
    color7  {{ colors.on_surface_variant.default.hex }}
    color15 {{ colors.on_surface.default.hex }}

    # Marks/badges: use semantic fixed colors without over-lightening so they stay colorful
    mark1_foreground {{ colors.on_primary_fixed.default.hex }}
    mark1_background {{ colors.primary_fixed.default.hex | lighten: -8.0 }}
    mark2_foreground {{ colors.on_secondary_fixed.default.hex }}
    mark2_background {{ colors.secondary_fixed.default.hex | lighten: -8.0 }}
    mark3_foreground {{ colors.on_tertiary_fixed.default.hex }}
    mark3_background {{ colors.tertiary_fixed.default.hex | lighten: -8.0 }}
<* endif *>

<* if {{ is_dark_mode }} *>
    active_tab_foreground {{ colors.on_primary.dark.hex }}
    active_tab_background {{ colors.primary.dark.hex }}
    inactive_tab_foreground {{ colors.on_primary_container.dark.hex }}
    inactive_tab_background {{ colors.primary_container.dark.hex | lighten: 10.0 }}

    # Use a lighter primary for the border in dark mode so it stands out
    active_border_color {{ colors.primary.light.hex }}
    # Use outline for subtle inactive borders
    inactive_border_color {{ colors.outline.default.hex }}
<* else *>
    active_tab_foreground {{ colors.on_primary.default.hex }}
    # Use the default primary (darker) as active tab background to ensure contrast
    active_tab_background {{ colors.primary.default.hex }}
    inactive_tab_foreground {{ colors.on_primary_container.light.hex }}
    inactive_tab_background {{ colors.primary_container.light.hex | lighten: -8.0 }}

    # Use primary_container for a soft but visible active border in light mode
    active_border_color {{ colors.primary_container.default.hex }}
    # Use outline for subtle inactive borders (not white)
    inactive_border_color {{ colors.outline.default.hex }}
<* endif *>
